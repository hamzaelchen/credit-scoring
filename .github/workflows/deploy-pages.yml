name: Déployer le frontend sur GitHub Pages

# Se déclenche sur chaque push sur main qui touche frontend/, ou manuellement (onglet Actions).
on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
  workflow_dispatch:

# Permissions minimales requises par la méthode officielle actions/deploy-pages
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois ; une nouvelle annule celle en cours plutôt que de s'empiler
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Empaqueter le contenu de frontend/
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Publier sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
